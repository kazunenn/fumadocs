# 第3章：投資対象の深層理解：各市場のメカニズムと特性

Fundoraの教育プログラムでは、単に取引ツールを学ぶだけでなく、市場の根源的なメカニズムと、その歴史的背景を深く理解することを重視します。ここでは、主要な投資対象の構造と、その価格を動かす真の要因を、テクニカルトレーダーが知るべき本質的な視点から解説します。

## 3.1 外国為替市場（FX）：グローバル経済の縮図を読み解く

外国為替市場は、世界中の通貨が交換される広大な電子的なネットワークであり、その1日の取引高は約7.5兆米ドル（2022年4月時点）に及び、世界のGDPの60倍に相当します。この市場は、銀行、企業、そして個々のトレーダーまで、あらゆる参加者がOTC（店頭取引）形式で繋がり、常に流動性を維持しています。

<Info title="Fundoraでの学習目標">
この巨大な市場の脈動を感じ取り、期待値に基づいた意思決定を行う力を養います。
</Info>

### 3.1.1 歴史と進化：為替制度の変遷

**金本位制からの脱却**
- **1944年**：ブレトンウッズ体制導入 - 固定相場制による厳格な管理
- **1971年**：ニクソン・ショック - 米ドルの金兌換停止
- **1976年**：ジャマイカ合意 - 変動相場制が国際的に公認

**電子取引の発展**
- **1990年代以降**： インターネットと電子取引技術の発展
- **EBS・Refinitiv Dealing**： 電子マッチングシステムの普及
- **2002年**：CLS Bank稼働 - PvP（Payment versus Payment）サービスによる決済リスク大幅低減

<Info title="現在の市場">
これにより、24時間取引可能な現在のグローバルなFX市場が形成されました。
</Info>

### 3.1.2 主要通貨ペアと流動性

**メジャー通貨5通貨**
世界のFX取引量の約8割は以下の通貨とそのペアに集中：
- 米ドル（USD）
- ユーロ（EUR）
- 日本円（JPY）
- 英ポンド（GBP）
- 豪ドル（AUD）

**メジャーペアの特徴**
- **スプレッド**： 比較的狭い
- **流動性**： 極めて高い
- **価格の滑り**： 少ない

<Info title="初心者への推奨">
流動性が極めて高くスプレッドが狭いため、初心者トレーダーが市場の基本的な挙動を学ぶ上で理想的な環境を提供します。
</Info>

**用語解説**
- **1pip**： 為替レートの最小変動単位（ドルの場合1セント・円の場合1銭）

### 3.1.3 取引時間帯の特徴

FX市場は、東京、ロンドン、ニューヨークの主要市場がリレー形式で開場することで、実質的に24時間稼働します。

| 市場           | 時間（JST）     | 特徴                                                     | 世界シェア      |
| :------------- | :-------------- | :------------------------------------------------------- | :-------------- |
| **東京市場** | 09:00–17:00     | 日本の経済指標やアジア情勢に反応、比較的穏やかな値動き     | 約8%            |
| **ロンドン市場** | 17:00–翌02:00   | 欧州の経済活動活発化、流動性高く値動き拡大傾向             | 38.1%（最重要） |
| **ニューヨーク市場** | 22:00–翌06:00   | 米国経済指標発表集中、ロンドンとの重複時間帯は特に活発 | 約17%           |

