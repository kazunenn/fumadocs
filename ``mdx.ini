## はじめに：Fundoraで「勝ち続けるトレーダー」を目指すあなたへ

Fundoraの教育プログラムへようこそ！
今、このページを開いているあなたは、市場で成功し、トレードを通じて自己実現を果たしたいという強い情熱を抱いていることでしょう。チャートの波に乗り、利益を掴む日を心待ちにしているかもしれません。
しかし、その前に、私たちはあなたに一つだけお願いしたいことがあります。それは、「数字が語る真実」に耳を傾け、トレードの根源にある「期待値」という数学的概念との対話を始めることです。

### トレードの本質：期待値という概念

トレードは、未来の価格を当てるギャンブルではありません。それは、「同じ行動を何百回、何千回と繰り返したとき、平均でいくら得られるか」を示す期待値という冷徹な数字を味方につける営みです。世界中のファンドや保険会社が長年利益を積み上げてきたのは、まさにこの数字を徹底的に追求し、管理してきたからに他なりません。

期待値の計算例： リスク1単位に対してリワード2単位を狙う取引（リスクリワード比 R=2）で勝率40%を維持できれば、期待値計算は以下のようになります：

```math
期待値 = (勝率 \times 利益) - (負率 \times 損失)
````

```math
期待値 = (0.4 \times 2) - (0.6 \times 1) = 0.8 - 0.6 = 0.2
```

これは、理論上、長期的には資金が増え続ける設計となることを意味します。
ここで最も大切なのは、「次のトレードで勝てるか」という目先の勝ち負けに一喜一憂するのではなく、「十分な回数をこなした平均で勝てるか」という長期的な視点です。確率論を無視し、ローソク足の形だけに感情を揺さぶられると、偶然の連勝を実力と誤解し、後に「大数の法則」が本来の期待値を露呈する——多くのトレーダーが経験する、その流れを私たちは避けたいのです。

### 人間の心理的な偏見：プロスペクト理論

とはいえ、人間は数字だけで完璧に動ける存在ではありません。後述する「プロスペクト理論」が示すように、私たちは同じ金額であっても"損失"を"利益"の約2倍以上大きく感じてしまいます。

  - 含み益は早く確定したくなる（利益確定の誘惑）
  - 含み損は「もう少しで戻るはず」と抱え込みがち（損失回避の本能）

あなたにも思い当たる節があるのではないでしょうか。この心理的ゆがみこそ、統計上は優位な手法であっても、リアルマネーを前にすると崩壊してしまう最大の原因です。

### 市場で生き残るための必須条件

だからこそ、市場で生き残るための条件はシンプルです。それは、\*\*損失回避を過度に恐れる自分を自覚し、期待値に従った損切りルールと資金配分を機械的に守る「規律」\*\*です。
この規律がなければ、どんな高度なテクニカル分析を学んでも、最後はあなたの心がチャートを歪めてしまい、市場から退場を余儀なくされるでしょう。

### 本テキストの目的と構成

このFundora教育テキストの「第一分冊」は、あなたがテクニカル分析に進む以前に、「勝ち続けるトレーダー」となるための揺るぎない土台を築くことを目的としています。
私たちは、以下の2つの理論が不可欠であると信じています：

1.  **確率論**：「優位性があるか」を冷徹に測る
2.  **プロスペクト理論**：「なぜ人はその優位性を手放すか」を理解する

この二つを深く理解して初めて、移動平均線やボリンジャーバンド、フィボナッチ水準、RSIやMACDといったテクニカルツールは、「当たるか外れるか」を占うお守りから、期待値をどう最大化するかを検証する精緻な計器へと姿を変えるのです。
「座学は退屈だし、早く実戦に行きたい」と感じるのは自然なことです。しかし、一度ここで強固な基礎を身につければ、将来テクニカル分析の森で迷ったときに、必ずこの地点に戻ってこられるでしょう。Fundoraは、そのときのための確かな地図とコンパスを用意しました。

#### 本分冊の学習内容：

  - トレーダーとして絶対に遵守すべき倫理と法的な規範
  - 期待値の計算方法と実践的な応用
  - 資金を守る安全装置としての厳格なリスク管理
  - 主要な投資対象の構造と、その市場を動かす本質的なメカニズム

あなたが「勝ち続けるトレーダー」への第一歩を踏み出す準備は、もう整っています。

