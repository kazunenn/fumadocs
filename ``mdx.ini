  特に流動性が厚く、大きなトレンド形成やボラティリティの拡大が見られやすい

<Info title="Fundora推奨">
各時間帯の特性を理解し、自身のトレードスタイルに合わせた戦略を構築することを推奨しています。
</Info>

### 3.1.4 価格変動要因：マクロ経済と地政学の融合

為替レートは、単なる需給だけでなく、複雑な経済・政治要因が絡み合って形成されます。

**短期要因（分～日単位）**
- 米雇用統計
- 消費者物価指数（CPI）
- 連邦公開市場委員会（FOMC）声明
- 中央銀行総裁の発言

<Info title="重要概念：サプライズ">
予測と結果の「サプライズ」が市場に短期的な大きな変動をもたらします。乖離が大きいほど、急激な値動きを引き起こす傾向があります。
</Info>

**中期要因（週～月単位）**
- 各国間の政策金利差
- 実質金利差
- 債券利回り格差
- キャリートレード - 高金利通貨への資金流入

<Info title="実例">
2022年のドル円急騰は日米10年債利回り差との高い相関を示しました。
</Info>

**長期要因（月～年単位）**
- 購買力平価（Big Mac指数などもその一例）
- 経常収支・貿易収支
- 国家の構造改革の進捗

**突発要因（予測不可能）**
- 地政学リスク（戦争、紛争）
- 大規模自然災害
- 中央銀行による為替介入

<Warning title="リスク管理への示唆">
これらは市場のボラティリティを一時的に急騰させ、リスク管理の重要性を改めて浮き彫りにします。
</Warning>

### 3.1.5 コスト構造とレバレッジの理解

**主なコスト**
- **スプレッド**： 買値と売値の差
- **スワップポイント**： 金利差調整額（金利差に基づく毎日発生する受払利息）

**レバレッジの特徴**
- **メリット**： 少額の資金で大きな取引が可能
- **リスク**： 利益を拡大する一方で、損失も拡大させる諸刃の剣

<Info title="Fundoraの安全設計例">
デモ環境では最大50倍のレバレッジを提供していますが、厳格なリスク管理原則を推奨しております：
- 「口座残高のリスク1%トレーディング基準」
- ATR（Average True Range）を用いた損切り幅の自動調整
- 常に資金曲線がプラスとなる期待値原則の実践
</Info>

