**ポジションサイジング**：
$$ \text{適正サイズ} = \frac{(\text{口座残高} \times \text{リスク割合})}{(\text{ストップ幅} \times \text{レバレッジ})} $$

例：

  - 口座残高：100万円
  - リスク割合：1%（1万円）
  - ストップ幅：1%
  - レバレッジ：5倍
