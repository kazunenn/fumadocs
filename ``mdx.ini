# 第4章：金融商品の実践的理解：CFDとレバレッジ商品

Fundoraのデモ環境で実際に取引する金融商品の仕組みを深く理解することは、適切なリスク管理と期待値計算の前提となります。本章では、CFD（差金決済取引）を中心としたレバレッジ商品の構造と特性を詳しく解説します。

## 4.1 CFD（Contract for Difference）の基本構造

CFDとは「差金決済取引」を意味し、実際の原資産（株式、指数、商品など）を保有することなく、価格変動による損益のみを取引する金融商品です。

### 4.1.1 CFDの基本メカニズム

**差金決済の仕組み**：

  - 実物の受渡しは行わない
  - 売買価格差のみを金銭で決済
  - 少額の証拠金で大きな取引が可能

**レバレッジ効果**：
例：日経225 CFD（レバレッジ5倍の場合）

  - 日経平均：30,000円
  - 必要証拠金：6,000円（30,000円 ÷ 5）
  - 1円の値動き = 5円分の損益

### 4.1.2 CFDの種類と特徴

| CFD種類       | 原資産           | レバレッジ | 取引時間     | 特徴             |
| :------------ | :--------------- | :--------- | :----------- | :--------------- |
| 株価指数CFD   | 日経225、S\&P500等 | 5-20倍     | ほぼ24時間   | 分散効果、流動性高 |
| 個別株CFD     | 個別企業株式     | 2-10倍     | 市場時間     | 銘柄固有リスク   |
| 商品CFD       | 金、原油、農産物 | 10-50倍    | ほぼ24時間   | インフレヘッジ   |
| 債券CFD       | 国債、社債       | 10-30倍    | 市場時間     | 金利感応度高     |

## 4.2 レバレッジのメカニズムと管理

### 4.2.1 レバレッジの数学的理解

**実効レバレッジの計算**：
$$ \text{実効レバレッジ} = \frac{\text{ポジション価値}}{\text{保有証拠金}} $$

例：

  - 口座残高：100万円
  - 日経225CFD：30,000円 × 1枚
  - 必要証拠金：6万円
  - **実効レバレッジ**：30万円 ÷ 100万円 = 3倍

**レバレッジと損益の関係**：

  - レバレッジ1倍：原資産1%上昇 → 1%利益
  - レバレッジ5倍：原資産1%上昇 → 5%利益
  - レバレッジ5倍：原資産1%下落 → 5%損失

### 4.2.2 証拠金システム

**当初証拠金（Initial Margin）**：

  - ポジション開始時の最低必要資金
  - 商品とレバレッジにより決定
  - 相場変動により動的に調整

**維持証拠金（Maintenance Margin）**：

  - ポジション維持の最低水準
  - 通常は当初証拠金の50-80%
  - 下回ると追証またはロスカット

**Fundoraでの証拠金管理**：

  - リアルタイム証拠金監視
  - 自動ロスカット機能
  - 証拠金不足アラート
  - 安全余裕度の表示

