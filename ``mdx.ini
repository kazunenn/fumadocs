### 4.3.1 オーバーナイト手数料

**スワップポイントの仕組み**：

  - ポジションの翌日持越し時に発生
  - 金利差調整としての性格
  - 買いポジション：通常マイナス
  - 売りポジション：場合によりプラス

**計算例（ドル円CFD）**：

  - 保有ポジション：10万ドル（買い）
  - 日米金利差：3%
  - 年間スワップコスト：10万ドル × 3% = 3,000ドル
  - **1日あたり**：3,000ドル ÷ 365日 = 8.2ドル

### 4.3.2 その他のコスト

  - **スプレッド**：
      - 売値と買値の差
