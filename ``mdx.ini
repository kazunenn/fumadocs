# 第2章：期待値とリスク管理の科学：生き残るための資金管理

トレードで最も大切なのは「生き残ること」です。どれほど優れたエントリー戦略も、リスク管理が甘ければ一度の大損で資金が吹き飛び、市場から退場を余儀なくされます。Fundoraでは、市場で長く安定的に生き残ることが最重要であると考えており、資金減少のリスクを最小化するための体系的手法を教材の核として組み立てています。

## 2.1 なぜリスク管理が最重要なのか：破産確率からの考察

トレードにおける最大の敵は「損失の連鎖」です。資金が一度大きく減少すると、回復には何倍ものリターンが必要になります。

### 資金減少の恐ろしい現実

**数学的事実**：

  - 50%の減少 → 回復に必要なリターン 100%
  - 75%の減少 → 回復に必要なリターン 300%
  - 90%の減少 → 回復に必要なリターン 900%

**心理的影響**： 損失後の恐怖感や焦燥感は、冷静な判断を曇らせ、さらなる判断ミスを誘発します。

\<Info title="Fundoraの基本方針"\>
「一度の大損が致命傷になる」現実を踏まえ、全カリキュラムを通じてリスク管理最優先の姿勢を徹底しています。
\</Info\>

### 2.1.1 バルサラの破産確率：退場リスクの数値化

トレードを長く続けるためには、「いずれ訪れる連敗の波」にどう備えるかが鍵です。バルサラの破産確率（Gambler's Ruin Problem）は、勝率、損益比、1回あたりのリスク割合などをもとに「いつ、どれだけの確率で資金が尽きるか」を数学的に算出する手法です。

#### 基本パラメータ

**設定条件**：

  - 初期資金： $C$
  - リスク割合： $B$（例：1% = 0.01）
  - 勝率： $P$、敗率： $Q = 1 - P$
  - 損益比（リワード/リスク）： $K$（例：利確20pips/損切10pips → $K = 2$）

#### 破産確率の計算方法

**基本方程式**：
$$ R = P \times R^{1+K} + Q $$

ここで：

  - $R$：破産確率
  - $R^{1+K}$：勝利後の状態での破産確率

**全体破産確率**：
$$ P_{\text{ruin}} = R^{1/B} $$

ここで $1/B$ は「資金をリスク単位で何回分持つか」を示します。 例：$B = 0.01$（1%ルール）の場合、100回分のリスクに相当。

#### 数値例による理解

**例1：理想的なケース**

  - $P = 0.5, Q = 0.5, K = 2, B = 0.01$
  - $R \\approx 0.7071$（数値解）
  - $P\_{\\text{ruin}} = 0.7071^{100} \\approx 1 \\times 10^{-15}$ → 事実上ゼロの破産確率

**例2：勝率低め・損益比1:1**

  - $P = 0.4, Q = 0.6, K = 1, B = 0.01$
  - $R \\approx 0.75$
  - $P\_{\\text{ruin}} = 0.75^{100} \\approx 3.2 \\times 10^{-13}$ → 依然極めて低リスク

\<Callout type="success" title="重要な発見"\>
1%トレーディング基準を守り適切な損益比を維持すれば、破産確率は限りなく低く抑えられることがわかります。
\</Callout\>

#### R値の求め方：反復法による数値解

初心者でもできる簡単な方法として「反復法」を紹介します：

1.  **初期値を設定**： $R\_0 = Q$（敗率）
2.  **繰り返し計算**： $R\_{n+1} = P \\times R\_n^{1+K} + Q$
3.  **収束まで継続**： $R\_n$ が一定値に収束すれば、その値を採用

\<Info title="実践ツール"\>
Excelや電卓で10〜20回繰り返せば十分な精度が得られます。
\</Info\>

#### 実践への活用ポイント

  - **リスク割合Bの影響**
    $B$が小さいほど資金の耐久回数は増え、破産確率が劇的に低下
  - **勝率と損益比のバランス**
    高い勝率でも損益比が小さいと破産確率は下がらず、逆も同様
  - **定期的な再計算**
    戦略変更や相場環境変化に応じてP、Kを再評価
  - **許容可能範囲の設定**
    破産確率が例えば0.1%未満ならリスク管理設計OK、と具体的な目安を設定

### 2.1.2 リスクリワード1:2の驚きの威力

トレード初心者が驚くポイントは、リスクリワード比（損益比）が2:1であれば、勝率が低くても十分にプラス期待値になることです。

#### ブレイクイーブン勝率の公式

$$ \text{必要勝率} = \frac{1}{1 + RR} $$

ここでRRはリスクリワード比（利益幅 ÷ 損失幅）です。

**RR = 2の場合**
$$ \text{必要勝率} = \frac{1}{1+2} = 33.3\% $$

#### 実例で見る期待値

**勝率30%, RR = 2の場合**：
$$ E = 0.3 \times 2 - 0.7 \times 1 = 0.6 - 0.7 = -0.1 \quad (-10\%) $$

**勝率35%, RR = 2の場合**：
$$ E = 0.35 \times 2 - 0.65 \times 1 = 0.7 - 0.65 = +0.05 \quad (+5\%) $$

\<Info title="驚きの事実"\>
勝率35%でも期待値Eがプラスになる点が、初心者にとって衝撃です。
\</Info\>

#### RR別必要勝率一覧

| RR（利益：損失） | 必要勝率（%） | 意味                             |
| :--------------- | :------------ | :------------------------------- |
| 1:1              | 50.0          | 半数勝てば損益ゼロ               |
| 2:1              | 33.3          | 3回に1回勝つだけで損益ゼロ       |
| 3:1              | 25.0          | 4回に1回勝つだけで損益ゼロ       |
| 4:1              | 20.0          | 5回に1回勝つだけで損益ゼロ       |
| 5:1              | 16.7          | 6回に1回勝つだけで損益ゼロ       |

#### 重要なポイント

**目から鱗の事実**：「勝率60%以上が当たり前」と思い込んでいる初心者にとって、RR = 2で33%勝てば損益ゼロになる事実はまさに目から鱗です。損切りを小さく、利確を少し広めに設定するだけで、数理的に生存確率と収益性が飛躍的に向上します。

#### 限界と注意点

\<Warning title="過剰RRの罠"\>
利確幅を極端に広げすぎると、実現率が著しく低下し勝率も下がるため、適切なバランスが不可欠
\</Warning\>
\<Warning title="相関リスク"\>
連敗は独立しない場合もあるため、相場の流れにも注意が必要
\</Warning\>
\<Warning title="心理のブレ"\>
低勝率トレードは不安を伴うため、心理的耐性の強化が求められる
\</Warning\>

## 2.2 期待値（Expectancy）の定義と公式：戦略の羅針盤

期待値とは、「ある行動を無限回繰り返したとき、平均していくら得られるか」を示す数学的指標です。

### 期待値の基本公式

```math
期待値(E) = 勝率(W) \times 平均利益(A_w) - (1 - 勝率(W)) \times 平均損失(A_l)
```

**パラメータの意味**：

  - $W$： 勝つ確率
  - $A\_w$： 勝ったときの平均利益
  - $A\_l$： 負けたときの平均損失

\<Info title="重要な理解"\>
この式が示すのは、勝率×利益の積から敗率×損失の積を引いたものが「長期的な1トレードあたりの期待利益」であるということです。
\</Info\>

### 2.2.1 期待値の歴史と提唱者

期待値という概念は、17世紀の賭博問題に端を発します。
**歴史的発展**：

  - **1654年**：パスカルとフェルマーの書簡
      - 「ポイント問題（途中終了した賭けの分配）」で交わした書簡
      - 現代確率論の始まり
      - 「将来得られる賞金の価値は、得られる確率に比例する」という原理を確立
  - **1657年**：ホイヘンスの体系化
      - クリスティアン・ホイヘンス『賭博における推論』を公刊
      - より複雑な期待値計算のルールを体系化
  - **1703年**：ベルヌーイの大数の法則
      - ヤコブ・ベルヌーイが"大数の法則"を示す
      - 多数回の試行で観測値が理論値に収束することを数学的に裏付け
  - **19世紀以降**：ラプラスの発展
      - 『確率論解析的理論』で期待値の応用が拡大
      - 統計学・物理学・経済学への展開
  - **20世紀以降**は投資・ギャンブル・ゲーム理論の基礎概念として定着

### 2.2.2 トレードへの応用：APPT（Average Profit Per Trade）

トレーダー向けには"APPT（平均トレード利益）"という名称でも呼ばれます：

```math
APPT = (勝率 \times 平均利益) - (敗率 \times 平均損失)
```

\<Warning title="重要な警告"\>
Investopediaでは、単なる損益比（Profit/Loss Ratio）にとらわれず、必ずAPPT（期待値）を計算せよと警鐘を鳴らしています。
\</Warning\>

**比較例**：

  - **シナリオA**： 損益比2:1、勝率30% → APPT マイナス
  - **シナリオB**： 損益比1:1、勝率60% → APPT プラス

\<Info title="核心的教訓"\>
リスクリワードだけでなく勝率を必ず掛け合わせることが重要
\</Info\>

### 2.2.3 期待値を支える投資格言・名言

  - **「損切りは機械的に、利益は伸ばせ」**
    言わずと知れた名言
    「平均損失を小さく、平均利益を大きく」という期待値向上の要諦を端的に表現
  - **「相場には大数の法則が宿る」**
    ベルヌーイが示した大数の法則
    少数の勝利に過度に期待せず、十分な試行回数を重ねることの重要性
  - **「負けたときの痛みを減らせば、長期勝負を制する」**
    期待値プラスでも大きなドローダウンを食らえば資金は枯渇
    資金管理と損切りルールの重要性

## 2.3 ポジションサイジング（資金配分）：資金を守る設計図

資金配分の設計こそ、リスク管理の要です。

### 2.3.1 固定金額リスク法 vs 割合リスク法

  - **固定金額リスク法**：
    常に同じ額（例：1万円）をリスクに晒す
    シンプルだが資金増減に対応できない
  - **割合リスク法**：
    口座残高の一定割合（例：1%）をリスクに晒す
    資金変動に自動的に調整される

\<Info title="Fundora推奨設定"\>
「口座残高 × 1%」をデフォルト設定とし、資金が増えても減ってもリスク量が自動的に調整される仕組みを推奨します。
\</Info\>

**メリット**：

  - 感情的な過剰な取引を回避
  - 安定した資金成長をサポート
  - 資金管理の自動化

### 2.3.2 相場の動きやすさに合わせる調整例：ATRの活用

**ATR（Average True Range）を使った動的調整**：
「値動きが大きいときは慎重に」「動きが小さいときは少し広めに」と調整するために、過去の価格変動幅を数値化します。
**手順**：

1.  過去14日間の1日の値幅平均を算出
2.  その平均値の1.2倍を「目安の損切り幅」に設定
3.  損切り幅に応じてロット数を自動調整

\<Callout type="info" title="テクニカル分析との連携"\>
ATRについてはテクニカル分析の項目で詳しく解説しますが、「相場がどれくらい動きやすいかを数字で測り、それに合わせてストップ幅とポジションサイズを決める」というシンプルな仕組みです。
\</Callout\>

## 2.4 Fundora流リスク管理ルール：厳格な規律の実践

Fundoraチャレンジを通じて身につけるべき厳格ルールを紹介します。これらのルールは、あなたの資金を守り、無駄な損失を避け、最終的に「勝ち続けるトレーダー」へと導くための指針です。

### 2.4.1 1回の取引リスク：1%トレーディング基準

**トレーディング基準**： 1回の取引で失うリスクを「口座残高の1%以内」に限定します。
**実践手順**： 取引前に必ず以下を計算・設定し、厳守してください：

1.  許容損失額の決定
2.  ストップ位置の設定
3.  適切なロット数の計算

### 2.4.2 1日＆累積損失上限

  - **1日の最大損失率**：5%
      - 超過で当日チャレンジ終了
      - 感情的なトレードの連鎖を防止
  - **累積最大損失率**：10%
      - 超過でチャレンジ失格
      - 再挑戦には特別講習の受講が必要

\<Info title="安全装置の意味"\>
これらは、感情的なトレードの連鎖を防ぎ、資金を大きく減らす前に一度立ち止まるための重要な安全装置です。
\</Info\>

### 2.4.3 最低保有時間と口座一元管理

  - **最低保有時間**：20秒
      - 20秒未満での決済を禁止
      - 「焦って切ってしまう」といった感情的な判断を防止
  - **複数口座の同時利用禁止**：
      - 一人で複数アカウントを開設することを禁止
      - 「複数口座でリスクを分散して見えづらくする」行為を防止
      - 自己の資金管理を徹底

## 2.5 心理的リスクへの対応：自己認識と規律の強化

感情はトレードの最大の敵です。統計的に優位な戦略を持っていても、人間の心理的バイアスがそれに抗い、損失を招くことは少なくありません。

### 2.5.1 感情チェックリスト

毎取引後、以下の3点を自己評価し、メンタルログに記録します。感情の"クセ"を可視化し、客観的に自己分析する習慣をつけましょう。
**チェック項目**：

  - 「恐怖を感じたか？」
  - 「欲張り過ぎていないか？」
  - 「焦ってルールを破らなかったか？」

### 2.5.2 クールダウンと制限の例

以下は推奨例ですが、自身の心理状態やトレードと向き合い、負けの連鎖を防ぐことを推奨いたします。

  - **過剰トレード防止**：
      - 1日10回以上のエントリー禁止
      - 過剰トレードを抑制
  - **感情的判断の防止**：
      - 連敗2回で15分以上の休憩
      - 感情の巻き返しを防止

## 2.6 リスク指標の活用：自己評価の明確化

### 2.6.1 最大ドローダウン（Max Drawdown）

**定義**： 資金ピークからの最大下落率を常時モニタリング
**Fundoraチャレンジの基準**：

  - 10%を超えた場合は失格
  - 資金を大きく減らすことを防ぐための重要な指標
    **計算方法**：

<!-- end list -->

```math
最大ドローダウン = \frac{(ピーク資金 - 最低資金)}{ピーク資金} \times 100\%
```

