# 第5章：リスクとの向き合い方

## 5.1 リスクの本質と分類：トレーダーが直面する多層的脅威

リスクとは「期待から外れる可能性」であり、トレードにおいては損失をもたらす可能性のある全ての要因を指します。成功するトレーダーは、これらのリスクを体系的に理解し、適切に管理する能力を持っています。

### 5.1.1 リスクの基本分類

- **市場リスク（Market Risk）**：
  - 価格変動による損失の可能性
  - 予測不可能な相場の動き
  - 全ての取引に内在する根本的リスク
- **信用リスク（Credit Risk）**：
  - 取引相手の債務不履行
  - ブローカーの破綻リスク
  - カウンターパーティリスク
- **流動性リスク（Liquidity Risk）**：
  - 売買したい時にできない可能性
  - 不利な価格での強制決済
  - 市場の厚みの変化
- **オペレーショナルリスク（Operational Risk）**：
  - システム障害による損失
  - 人為的ミスによる問題
  - 外部環境の変化

## 5.2 市場リスクの詳細分析：価格変動の要因と対策

### 5.2.1 方向性リスク（Directional Risk）

**定義と特徴**：
- 予想とは逆方向への価格変動
- トレンドフォロー戦略で最も重要
- ポジションの方向性に依存

**測定方法**：
```math
\text{方向性リスク} = \text{ポジションサイズ} \times \text{価格変動幅} \times \text{レバレッジ}
````

**例**：

  - EUR/USD 10万通貨買い
  - 1円下落時の損失 = 10万 × 1円 = 10万円

**管理手法**：

  - **ストップロス注文**：
      - 損失限定の基本ツール
      - 機械的な執行の重要性
      - 適切な水準の設定
  - **ポジションサイズ管理**：
      - 1%ルールの徹底
      - 口座残高に応じた調整
      - 複数ポジション時の総合管理

### 5.2.2 ボラティリティリスク（Volatility Risk）

**変動性の二面性**：

  - **高ボラティリティ**：大きな利益機会 vs 大きな損失リスク
  - **低ボラティリティ**：安定性 vs 利益機会の制限

**ボラティリティの測定**：

  - 標準偏差による数値化
  - ATR（Average True Range）の活用
  - VIX指数などの恐怖指数

**実践的管理方法**：

```math
\text{調整ポジションサイズ} = \frac{\text{基準ポジション}}{(\text{現在ATR} \div \text{基準ATR})}
```

**例**：

  - 基準ATR：100pips
  - 現在ATR：200pips（2倍に拡大）
  - 調整後ポジション：基準の50%に縮小

## 5.3 信用リスクと流動性リスク：見えない脅威への備え

### 5.3.1 信用リスクの現実的評価

**ブローカー選択の重要性**：

  - 財務健全性の確認
  - 規制環境の確認
  - 顧客資金の分別管理

**リスク軽減策**：

  - **分散化**：
      - 複数ブローカーの利用
      - 資金の分散配置
      - リスク集中の回避
  - **監視**：
      - 定期的な財務状況確認
      - 業界動向の把握
      - 早期警戒システム

### 5.3.2 イールドカーブリスク：金利の期間構造変化

**実践的な理解：イールドカーブの読み方**
イールドカーブは、単なる金利の羅列ではなく、市場参加者の将来への期待が凝縮された情報の宝庫です。Fundoraの学習者は、この曲線の変化から相場の方向性を読み取る力を養う必要があります。

**標準的なカーブ形状**

  - **順イールド（正常）**： 短期金利 \< 長期金利
  - **フラット**： 短期金利 ≈ 長期金利
  - **逆イールド（異常）**： 短期金利 \> 長期金利（景気後退の前兆として注目）

**実際の変化パターンと市場への影響**
| カーブ変化 | 金融政策含意       | 株式市場             | 為替市場     | 債券市場       |
| :----------- | :----------------- | :------------------- | :----------- | :------------- |
| スティープ化 | 緩和的→引締め予想 | 銀行株↑、成長株↓   | 通貨高圧力   | 長期債↓        |
| フラット化   | 引締め→緩和予想   | ディフェンシブ有利   | 通貨安圧力   | 短期債↓        |
| パラレルシフト | 一律的な政策変更   | 全体的な方向感       | 金利差影響   | 全年限同方向   |

\<Info title="Fundoraでの活用例"\>
