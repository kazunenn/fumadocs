## 5.5 リスクの統合管理：ポートフォリオレベルでの最適化

個別のリスクを理解した上で、それらを総合的に管理する仕組みが必要です。これが「統合リスク管理」の考え方です。

### 5.5.1 相関リスクの理解

**相関係数の基本**：

  - **+1.0**： 完全な正の相関（一方が上がれば他方も必ず上がる）
  - **0.0**： 無相関（独立した動き）
  - **-1.0**： 完全な負の相関（一方が上がれば他方は必ず下がる）

**主要資産間の典型的相関**：
| 資産ペア             | 平常時相関   | 危機時相関    | 特徴                                |
| :------------------- | :----------- | :------------ | :---------------------------------- |
| 株式-債券            | -0.3～0.1    | -0.6～-0.8    | 危機時により負の相関が強まる        |
| ドル-金              | -0.5～-0.2   | -0.7～-0.9    | ドル安時に金が買われる傾向          |
| 株式-VIX             | -0.7～-0.9   | -0.9～-1.0    | 恐怖指数と株価は強い負の相関        |
| 新興国株式-先進国株式 | 0.7～0.9     | 0.9～1.0      | 危機時により相関が高まる            |

**相関の時間変動性**： 相関係数は固定的なものではなく、市場環境により大きく変動します。特に危機時には相関が急激に高まり、分散効果が失われる「相関ブレークダウン」が発生しやすくなります。

### 5.5.2 VaR（Value at Risk）による統合的リスク測定

VaRは「一定期間内に、一定の信頼度で発生し得る最大損失額」を示すリスク指標です。

**VaRの基本概念**：

  - 信頼度95%、保有期間1日のVaR = 100万円
  - **意味**：「20日に1日は100万円を超える損失が発生する可能性がある」

**VaRの計算手法**：

1.  **パラメトリック法（分散・共分散法）**：
    ```math
    VaR = \text{ポートフォリオ価値} \times \sigma \times Z_{\alpha}
    ```
      - $\\sigma$：ポートフォリオの標準偏差
      - $Z\_{\\alpha}$：信頼度$\\alpha$の標準正規分布の値
2.  **ヒストリカル法**：
      - 過去のデータから実際の損益分布を作成
      - 下位$\\alpha$%のパーセンタイル値をVaRとする
3.  **モンテカルロ法**：
      - 確率的シミュレーションによる多数のシナリオ生成
      - 各シナリオでの損益を計算し、分布を作成

**VaRの限界と補完指標**：

  - **限界**：
      - VaRを超える損失（テールリスク）の大きさは測定できない
      - 正規分布を仮定するため、極端な事象を過小評価する可能性
  - **補完指標**：
      - **ES（Expected Shortfall）**： VaRを超えた場合の平均損失額
      - **ストレステスト**： 極端なシナリオでの損失評価

### 5.5.3 ストレステストとシナリオ分析

ストレステストの目的は、過去の危機や想定される極端な状況下で、ポートフォリオがどの程度の損失を被るかを事前に把握することです。

**代表的なストレスシナリオ**：

  - **歴史的シナリオ**：
      - 2008年リーマンショック
      - 2020年コロナショック
      - 2011年東日本大震災
  - **仮想的シナリオ**：
      - 主要国の金利急騰
      - 地政学リスクの顕在化
      - システミックリスクの発生

\<Info title="Fundoraでの活用"\>
学習者には、自身のポートフォリオを想定して以下のシナリオ分析を実践してもらいます：

  - 「円急騰シナリオ」（ドル円が1日で5円下落）
  - 「株価急落シナリオ」（日経平均が1日で10%下落）
  - 「流動性枯渇シナリオ」（スプレッドが通常の5倍に拡大）
    \</Info\>

## 5.6 リスクマネジメントの実践：Fundoraチャレンジでの適用

これまで学んだリスク管理の知識を、実際のトレード環境で体系的に適用する方法を解説します。

### 5.6.1 事前リスク評価のフレームワーク

**トレード前チェックリスト**：

1.  **市場環境の評価**：
      - [ ] 主要経済指標の発表予定を確認
      - [ ] 地政学リスクの状況を確認
      - [ ] 市場のボラティリティ水準を確認
      - [ ] 流動性の状況を確認
2.  **ポジション設計**：
      - [ ] 損切り位置を事前に決定
      - [ ] リスクリワード比を計算
      - [ ] ポジションサイズを1%ルールで算出
      - [ ] 最大ドローダウンへの影響を評価
3.  **実行時の注意**：
      - [ ] システムの動作を確認
      - [ ] 発注内容をダブルチェック
      - [ ] 緊急時の対応策を確認

### 5.6.2 リアルタイムリスク監視

**取引中の監視項目**：

  - **ポジションレベル**：
      - 未実現損益の状況
      - ストップロスまでの距離
      - 保有時間と当初計画との乖離
  - **ポートフォリオレベル**：
      - 総合的な損益状況
      - 相関の変化
      - 流動性の変化
  - **市場レベル**：
      - ボラティリティの急激な変化
      - 重要ニュースの発生
      - システム障害の発生

### 5.6.3 事後評価とフィードバック

**取引終了後の振り返り**：

  - **定量的評価**：
      - 実際のリスクリワード比
      - 予想との乖離分析
      - リスク指標の事後検証
  - **定性的評価**：
      - 心理状態の記録
      - 判断プロセスの検証
      - 改善点の洗い出し

**月次・四半期評価**：

  - VaRと実際の損失の比較
  - シャープレシオなどのパフォーマンス指標
  - リスク管理ルールの有効性検証

\<Info title="継続的改善"\>
リスク管理は一度設定して終わりではなく、市場環境の変化や自身の成長に合わせて継続的に見直し・改善していく必要があります。
\</Info\>

