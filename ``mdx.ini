- 2024年東証一部現物株式一日平均売買代金： 約5.0兆円（世界有数の流動性）

### 3.2.3 株式の種類と取引形態

**株式の種類**
- **普通株**： 議決権・配当権を持つ一般的な株式
- **優先株**： 配当優先だが議決権制限あり

**取引形態**

| 取引形態   | レバレッジ   | 特徴                        | コスト・リスク          |
| :--------- | :----------- | :-------------------------- | :---------------------- |
| 現物取引   | なし（100%キャッシュ） | 配当・株主優待受取可能      | レバレッジ利用不可      |
| 信用取引   | 最大3倍      | 空売り可能                  | 追証・金利コスト発生    |

### 3.2.4 価格変動要因と時間軸

| 時間軸         | 主なドライバー                | 解説                                              |
| :------------- | :------------------------------ | :------------------------------------------------ |
| 数分～数時間   | 板需給・アルゴ取引              | 小口注文や高頻度取引が価格を大きく動かす          |
| 1日～数週間    | 決算発表・会社ガイダンス        | EPSサプライズ（予想との乖離）が窓開けを生む       |
| 数ヶ月～年     | 金利・景気サイクル              | 長期金利↑＝割引率↑→株価↓の関係が基本            |
| 数年～十数年   | 事業モデル・競争優位・規制変化  | 特許取得や市場シェア変化が中長期トレンドに影響    |

### 3.2.5 コスト構造

**主なコスト**
- **売買手数料**： ネット証券で無料が主流
- **金利コスト（信用取引時）**： 年率約2.0～3.0%程度
- **品貸料（空売り時の貸株料）**
- **スリッページ（約定価格乖離）**
- **税金**： 譲渡益・配当とも20.315%（源泉徴収）

<Warning title="板読みの重要性">
板読み（板情報の観察）が甘いと、指値注文が約定せず成行で高値・安値をつかまされるケースが多いため、流動性の低い銘柄では必ず板厚を確認しましょう。
</Warning>

