## 3.3 債券市場：利息付き借用証（IOU）の構造と金利サイクル活用

債券は、国や企業が資金を借り入れる際に発行する**「借用証書」**であり、定期的に利息（クーポン）が支払われ、満期には元本が返済されます。その市場規模は株式市場をも凌駕し、世界経済の安定性を示す重要な指標となります。

<Info title="Fundoraでの学習目標">
債券市場の動きが株式や為替市場に与える影響を深く理解し、ポートフォリオ全体のリスク管理に活かす視点を養います。
</Info>

### 3.3.1 歴史と金融政策との連動

**市場規模**
- **公募債発行残高**： 約140兆米ドル（2024年BIS推計）
- **取引形態**： 主に店頭相対取引（OTC：相対で価格交渉）
- **流動性**： 発行体・銘柄ごとに大きく異なる

**歴史的発展**
債券の概念は古くから存在しますが、近代的な国債市場の発展は、国家財政の必要性と中央銀行の金融政策に密接に結びついています。特に20世紀以降、各国中央銀行が金利を操作することで経済を安定させようとする中で、債券市場は金融政策の効果を測る主要な舞台となりました。

### 3.3.2 債券の主な種類

| 種類         | 内容                                         | リスク特性                      |
| :----------- | :------------------------------------------- | :------------------------------ |
| 国債（Sovereign） | 国家が発行、最も信用リスクが低い           | 金利リスクのみ                  |
| 地方債（Municipal） | 地方公共団体が発行、税優遇がある場合あり     | 信用リスク低め                  |
| 社債（Corporate） | 企業が発行、格付けが高いほど安全だが低いとジャンク債に分類 | 信用リスク／流動性リスク有り    |
| 外債（Foreign）   | 外国通貨建て、為替リスクも加味               | 為替リスク＋信用リスク          |
| 物価連動債   | 消費者物価指数（CPI）に連動して元本が調整される | インフレヘッジだが金利リスク有り |

### 3.3.3 価格決定と利回り（Yield）

**基本価格式**
```math
P = \sum_{t=1}^{n} \frac{CF_t}{(1+y)^t}
````

ここで：

  - $CF\_t$： 期ごとの支払額
  - $y$： 利回り

\<Info title="重要な関係"\>
利回りが上昇（市場金利↑）すると分母が大きくなり、価格は下落します。
\</Info\>

**Fundoraでの活用**
この価格決定メカニズムを理解することで、金利変動リスクを的確に捉え、他のアセットクラスとの相関を分析する基礎を築きます。

### 3.3.4 デュレーションとコンベクシティ：金利感応度の計測

**デュレーション（Duration）**

  - **定義**： 金利1%変動で何%価格が動くかを示す感応度指標（期間的平均）
  - **特徴**： 長期債ほど大きくなる

**コンベクシティ（Convexity）**

  - **定義**： 金利変動が大きい時にデュレーションだけでは測りきれない非線形幅を補正する指標
  - **ヘッジ手法**： 長期債ほど大きく、金利変動リスクを抑えるには「短期債＋金利スワップヘッジ」が有効

### 3.3.5 主要リスクと低減策

| リスク       | 内容                               | 低減策                               |
| :----------- | :--------------------------------- | :----------------------------------- |
| 金利リスク   | 市場金利上昇→既発債価格下落        | デュレーション短縮、債券先物ヘッジ   |
| 信用リスク   | 発行体の信用格下げ・デフォルト     | 格付け分散、クレジットデフォルトスワップ利用 |
| 流動性リスク | 板が薄く売却価格が極端に不利になる | 取引残高・出来高の多い銘柄に集中     |
| 再投資リスク | クーポン受取後の再投資利回りが下落 | ストリップ債（利息分離債）活用     |
| 為替リスク   | 外債を円換算した際の為替変動       | 通貨ヘッジ付きファンド利用         |

\<Info title="Fundoraの方針"\>
これらのリスクを事前に評価し、適切なリスク低減策を講じることの重要性を強調します。
\</Info\>

### 3.3.6 債券と他資産の相関

**主要相関関係**

  - **株式**： リスクオフ期に逆相関
  - **為替**： 金利差拡大で高金利通貨買い→低金利通貨売り
  - **コモディティ**： 実質金利↑で金↓など

\<Info title="戦略応用"\>
相関構造を踏まえたクロスアセット戦略（例：JGB利回り↑→ドル円買い）を学ぶことでポートフォリオ全体のリスク低減につなげます。
\</Info\>

### 3.3.7 ファンダメンタルズ指標

**重要指標**

  - **デフォルトスプレッド**： BBB社債利回り－国債利回り（信用リスクのバロメーター）
  - **OAS（Option-Adjusted Spread）**： 償還オプションを除いたクレジットスプレッド
  - **Bid/Ask Spread**： 買値と売値の差（流動性指標、0.02円以下が良い）

### 3.3.8 Fundoraとの接点

Fundoraでは個別債券を直接取扱いませんが、金利サイクルはFX・株価指数CFDのトレードシナリオを左右します。

**実践的学習内容**

  - FXスワップ演習（スワップポイント＝金利差収益の計算）
  - 10年米国債先物 vs ドル指数の相関分析
  - PER（金利連動性）：株式CFDのPERが国債利回りと逆相関になる仕組み

\<Info title="スキル転用"\>
本章で身につけた「金利変動の波を乗りこなす視点」は、以降の資産クラス分析にも一貫して活用できます。
\</Info\>

## 3.4 株価指数先物：インデックスを先渡しで売買する仕組み

株価指数先物（Index Futures）は、「将来の特定期日に、現時点で定めた価格で株価指数を受渡する契約」です。レバレッジを効かせた取引が可能であり、現物市場のヘッジや投機、裁定取引など、多様な目的に利用されます。

### 3.4.1 定義と市場規模

**世界最大級の市場**

  - S\&P 500 E-mini（CME）
  - 日経225先物（大阪取引所）
  - 1日平均出来高：ラージ換算で10万枚超
  - 証拠金残高：数兆円規模
  - **取引方式**： 取引所を介した集中清算方式

### 3.4.2 代表的銘柄と契約仕様

| 銘柄             | 乗数           | 最小値幅 | 1ティック価値 | 取引時間（JST）                           |
| :--------------- | :------------- | :------- | :------------ | :---------------------------------------- |
| 日経225 ラージ   | 指数×1,000円   | 10円     | 10,000円      | 08:45–15:15、16:30–翌06:00                 |
| 日経225 ミニ     | 指数×100円     | 5円      | 500円         | 同上                                      |
| S\&P 500 E-mini   | 指数×50ドル    | 0.25pt   | 12.50ドル     | 23:30–翌06:00                             |

\<Info title="乗数の理解"\>
乗数：先物価格に掛け合わせる額。たとえば「ラージ1枚＝日経平均×1,000円」で損益が計算される。
\</Info\>

### 3.4.3 清算・証拠金・レバレッジ

**証拠金システム**

  - **証拠金（必要担保金）**： SPAN法で算出
  - **日経225ラージ**： 約130万円前後（変動制）
  - **Variation Margin（日々清算）**： 取引所清算機構が毎営業日、時価評価差を徴収・支払い

**リスク管理**

  - **証拠金維持率**： 100％未満で強制ロスカット（強制決済）
  - **レバレッジ**： 必要証拠金に対して約8～10倍が目安（相場状況で変動）

### 3.4.4 主な利用目的

**4つの主要用途**

  - **ヘッジ**： 現物株式やETF保有リスクを先物売りで相殺
  - **裁定取引**： 現物（ETF）と先物の価格差（ベーシス）を狙う短期売買
  - **投機**： レバレッジの効いた短期トレード
  - **夜間取引活用**： 米市場指標連動

### 3.4.5 価格決定要因

**理論価格（Fair Value）**

```math
\text{Futures} = \text{Spot} \times e^{(r-d) \times T}
```

ここで：

  - $r$： 無リスク金利（短期金利）
  - $d$： 配当利回り（指数構成銘柄の配当想定）
  - $T$： 残存期日までの年率換算期間

\<Info title="裁定機会"\>
配当落ちや金利差変動が理論価格乖離（裁定機会）を生みます。
\</Info\>

### 3.4.6 特有リスク

| リスク       | 内容                               | 対策                                 |
| :----------- | :--------------------------------- | :----------------------------------- |
| レバレッジ   | 1%の指数変動で証拠金の大半が動く   | ポジションサイズは証拠金×30%以内   |
| SQ（清算値） | 四半期ごとの最終決済でボラ拡大     | ロール（期近→期先乗換）を前倒し     |
| 夜間急変     | 海外市場開場前のサプライズで大幅乖離 | 自動OCO注文で損益を限定             |
| ベーシスリスク | 現物ETFと先物の価格差が長期化      | 裁定戦略のストラテジーを併用         |

