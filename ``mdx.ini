| :------- | :------------ | :--------- | :----------- | :-------------------------------- |
| Prime    | 旧一部        | 約2,100社  | 約600兆円    | 大型・高流動性                    |
| Standard | 旧二部        | 約500社    | 約28兆円     | 中堅・安定成長                    |
| Growth   | 旧マザーズ等  | 約280社    | 約8兆円      | 小型・高成長・高ボラティリティ    |

- **区分による違い**
  - 流動性（売買板の厚さ）
  - 開示義務の厳しさ
  - 取引コストとリスクの差
- **地域証券取引所**
  - 名古屋： 290社
  - 福岡： 110社
  - 札幌： 57社

**米国の二大市場**

| 取引所 | 特徴                                    | 上場企業数 | 時価総額                                    |
| :----- | :-------------------------------------- | :--------- | :------------------------------------------ |
| NYSE   | 伝統的フロア＋電子システムのハイブリッド | 約2,400社  | 世界有数企業中心                            |
| Nasdaq | 1971年設立の完全電子市場                | 約3,900社  | 約30兆米ドル、IT・バイオ系中心              |

- **取引時間**：現地9:30–16:00（東部標準時）
- 流動性・出来高ともに世界一・二を争う

