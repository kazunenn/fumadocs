### 5.3.3 流動性リスク：「売りたいときに売れない」恐怖

流動性リスクは、市場の混乱時に最も顕在化する隠れたリスクです。平時は気づかれませんが、危機時には致命的な損失をもたらす可能性があります。

**流動性の測定指標**

  - **ビッドアスクスプレッド**： 買値と売値の差（狭いほど流動性が高い）
  - **市場の厚み**： 各価格帯での注文量
  - **成行インパクト**： 大口注文が価格に与える影響度

**流動性枯渇の典型例**

  - **2008年リーマンショック時**：
      - 企業の社債市場で流動性が急激に悪化
      - 売り手ばかりで買い手が消失
      - AAA格付けでも20%以上の価格下落
  - **2020年3月コロナショック時**：
      - 「安全資産」とされる米国債でさえ流動性が一時的に枯渇
      - 金ETFと現物金価格に大幅な乖離が発生
      - FX市場でも通常1-2pipsのスプレッドが一時的に10pips超に拡大
  - **新興国通貨の流動性リスク**：
      - トルコリラ、南アフリカランドなど高金利通貨
      - 地政学リスク発生時に流動性が急速に悪化
      - スワップ狙いの投資家が一斉に損切りに走る事態

**流動性リスクへの対策**
\<Info title="Fundora推奨の対策"\>

  - **主要通貨ペアの選択**：
      - EUR/USD、GBP/USD、USD/JPYなど流動性の厚い通貨ペアを選好
      - マイナー通貨は避ける
  - **取引時間の意識**：
      - ロンドン・ニューヨーク重複時間帯（22:00-01:00 JST）を活用
      - 薄商い時間帯（早朝・祝日）でのトレードを控制
  - **ポジションサイズの制限**：
      - 大口ポジションほど流動性リスクが高まる
      - 分割エントリー・分割決済の活用
  - **緊急時プランの策定**：
      - 流動性悪化時の損切りルールを事前に決定
      - OCO注文などの活用

\</Info\>

\<Warning title="重要な警告"\>
流動性リスクは「見えないリスク」であり、平時の検証では見落とされがちです。しかし、一度顕在化すると致命的な損失に繋がるため、常に意識しておく必要があります。
\</Warning\>

