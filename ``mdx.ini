## 3.2 株式市場：企業「持分」の取引を理解する

株式は、企業の所有権の一部を表す証券であり、投資家は株式を保有することで、企業の成長から恩恵を受けたり、配当金を得たりすることができます。株式市場は、企業の資金調達と投資家の資産運用を結びつける重要な役割を担っています。

<Info title="Fundoraでの学習目標">
株価の変動要因を深く理解し、期待値に基づいたトレード戦略を構築する基礎を築きます。
</Info>

### 3.2.1 歴史と市場規模

**グローバル市場規模**
- 世界の株式市場時価総額： 約100兆米ドル（2024年IMF推計）

**日本市場の発展**
- **起源**： 江戸時代後期の大坂堂島の米先物取引
- **1878年5月15日**： 政府主導で東京株式取引所（TSE）設立
- **1949年5月16日**： 戦後再開（現在の東京証券取引所）
- **1999年**： 完全電子化へ移行
- **2010年**： 次世代取引システム"Arrowhead"稼働、市場インフラの近代化完了

**主要海外市場**
- **米国**： 1792年のButtonwood Agreement起源
  - NYSE・Nasdaq： 二大市場として世界を牽引
- **英国**： London Stock Exchange (LSE)、1801年設立、欧州の金融ハブ

### 3.2.2 主要市場セグメントと取引方式

**日本の市場区分（東証）**

