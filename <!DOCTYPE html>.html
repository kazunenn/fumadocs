<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロトレーダーへの道 - Fundora</title>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* 全体的なスタイル */
        body {
            background-color: #332E2B; /* 全体背景 */
            color: #F5F5F5; /* テキスト */
            font-family: 'Noto Sans JP', sans-serif; /* 基本フォント */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px; /* スマホ表示を考慮したパディング */
            box-sizing: border-box;
            overflow: hidden; /* Prevent scrollbars from canvas/particles */
        }

        /* 背景用キャンバス */
        #chart-background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; /* Behind game container, in front of particles */
            opacity: 0.15; /* Subtle chart */
        }

        /* ゲームコンテナ */
        .game-container {
            background-color: rgba(30, 26, 24, 0.95); /* Slightly transparent to show chart */
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            max-width: 600px; /* 最大幅 */
            width: 100%; /* レスポンシブ対応 */
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            margin: auto; /* 中央寄せ */
            border: 1px solid #EF6A00; /* Fundora感を出す枠線 */
            animation: containerGlow 3s ease-in-out infinite alternate;
            position: relative; /* Ensure it's above the canvas */
            z-index: 1;
        }

        @keyframes containerGlow {
            0% { box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), 0 0 10px rgba(239, 106, 0, 0.1); }
            100% { box-shadow: 0 0 30px rgba(239, 106, 0, 0.3), 0 0 15px rgba(239, 106, 0, 0.2); }
        }

        /* タイトル */
        h1 {
            color: #EF6A00;
            font-family: 'Ubuntu', sans-serif;
            margin-bottom: 20px;
            font-size: clamp(1.8em, 6vw, 3em);
            text-shadow: 0 0 8px rgba(239, 106, 0, 0.5);
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        /* ストーリーテキスト */
        .story-text {
            margin-bottom: 30px;
            font-size: clamp(0.9em, 2.5vw, 1em);
            line-height: 1.8;
            text-align: left;
            border-left: 4px solid #EF6A00;
            padding-left: 15px;
            color: #E0E0E0;
            animation: fadeInUp 1s ease-out;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ボタン共通スタイル */
        .game-button {
            background-color: #EF6A00;
            color: #F5F5F5;
            border: none;
            padding: 15px 30px;
            font-size: clamp(1em, 3vw, 1.2em);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Noto Sans JP', sans-serif;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }

        .game-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .game-button:hover::before { left: 100%; }
        .game-button:hover {
            background-color: #d05c00;
            box-shadow: 0 6px 8px rgba(0, 0, 0, 0.4);
            transform: translateY(-2px);
        }
        .game-button:active {
            transform: scale(0.98);
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.3);
        }

        /* 問題表示エリア */
        .question-area {
            display: none;
            text-align: left;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .question-area h2 {
             color: #EF6A00;
             margin-bottom: 20px;
             font-size: clamp(1.2em, 4vw, 1.5em);
             border-bottom: 2px solid #EF6A00;
             padding-bottom: 10px;
        }

        .question-text {
             margin-bottom: 20px;
             font-size: clamp(1em, 3vw, 1.1em);
             line-height: 1.6;
             white-space: pre-wrap;
        }

        /* 選択肢リスト */
        .options-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .options-list li {
            background-color: #554d48;
            margin-bottom: 15px;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: clamp(0.9em, 2.5vw, 1em);
            line-height: 1.4;
            border: 1px solid transparent;
            opacity: 0;
        }

        @keyframes slideInOptions1 {
            from { transform: translateX(-100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes slideInOptions2 {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeInOptions {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleUpOptions {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
         @keyframes rotateInOptions {
            from { transform: rotateY(-90deg) translateX(-50px); opacity: 0; }
            to { transform: rotateY(0deg) translateX(0); opacity: 1; }
        }

        .options-list li:hover {
            background-color: #6a625d;
            transform: translateX(5px) scale(1.02);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
         .options-list li:active { transform: scale(0.98); }
        .options-list li.selected {
           border: 2px solid #EF6A00;
           animation: selectedPulse 0.5s ease-in-out;
        }
        @keyframes selectedPulse {
            0%, 100% { transform: scale(1) translateX(0); }
            50% { transform: scale(1.02) translateX(0); }
        }

        /* フィードバックエリア */
        .feedback-area {
            display: none;
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            text-align: left;
            border: 1px solid transparent;
            animation: feedbackSlide 0.5s ease-out;
        }
        @keyframes feedbackSlide {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .feedback-area.correct {
            background-color: #28a745;
             border-color: #28a745;
             animation: correctShake 0.6s ease-in-out, feedbackSlide 0.5s ease-out;
        }
        @keyframes correctShake {
            0%, 100% { transform: translateX(0) translateY(0); }
            25% { transform: translateX(-5px) translateY(0); }
            75% { transform: translateX(5px) translateY(0); }
        }
         .feedback-area.incorrect {
            background-color: #dc3545;
             border-color: #dc3545;
             animation: incorrectShake 0.6s ease-in-out, feedbackSlide 0.5s ease-out;
        }
        @keyframes incorrectShake {
            0%, 100% { transform: translateX(0) translateY(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px) translateY(0); }
            20%, 40%, 60%, 80% { transform: translateX(5px) translateY(0); }
        }
        .feedback-area h3 {
            margin-top: 0;
            color: #F5F5F5;
            font-size: clamp(1em, 3vw, 1.2em);
            margin-bottom: 10px;
        }
        .feedback-area p {
            margin-bottom: 10px;
            line-height: 1.6;
             font-size: clamp(0.9em, 2.5vw, 1em);
        }

        /* 進行状況バーコンテナ */
         .progress-bar-container {
            width: 100%;
            background-color: #554d48;
            border-radius: 5px;
            margin-bottom: 20px;
            height: 20px;
            overflow: hidden;
            border: 1px solid #EF6A00;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #EF6A00, #ff8533);
            border-radius: 5px;
            transition: width 0.8s ease-in-out;
            position: relative;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: progressShine 2s linear infinite;
        }
        @keyframes progressShine {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* ステータス情報 */
         .status-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: clamp(0.8em, 2vw, 0.9em);
            flex-wrap: wrap;
            padding-bottom: 10px;
            border-bottom: 1px dashed #554d48;
        }
        .status-info span {
            flex-grow: 1;
            text-align: center;
            margin: 5px;
            transition: color 0.3s ease;
        }
        .status-info span:hover { color: #EF6A00; }

        /* ゲーム終了画面 */
        #end-screen {
            display: none;
             text-align: center;
             animation: endScreenFade 1s ease-out;
        }
        @keyframes endScreenFade {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
         #end-screen h2 {
            color: #EF6A00;
            margin-bottom: 20px;
            font-size: clamp(1.5em, 5vw, 2em);
            text-shadow: 0 0 8px rgba(239, 106, 0, 0.5);
            animation: titlePulse 2s ease-in-out infinite;
         }
         #weakness-feedback {
             margin-top: 30px;
             padding-top: 20px;
             border-top: 1px solid #554d48;
         }
         #weakness-feedback h3 {
             color: #EF6A00;
             margin-top: 0;
             margin-bottom: 15px;
             font-size: clamp(1em, 3vw, 1.2em);
             text-align: left;
         }
         #weakness-feedback ul {
             list-style: none;
             padding: 0;
             text-align: left;
         }
         #weakness-feedback li {
             background-color: #554d48;
             margin-bottom: 10px;
             padding: 10px 15px;
             border-radius: 5px;
             font-size: clamp(0.9em, 2.5vw, 1em);
             animation: fadeInUp 0.5s ease-out forwards;
             opacity: 0;
             cursor: pointer;
             transition: background-color 0.3s ease;
         }
         #weakness-feedback li:hover { background-color: #6a625d; }

        /* 背景パーティクルアニメーション */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background-color: #EF6A00;
            border-radius: 50%;
            pointer-events: none;
            animation-name: float;
            animation-timing-function: linear;
            animation-iteration-count: infinite;
            z-index: -2; /* Furthest back */
        }
        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100px) rotate(360deg); opacity: 0; }
        }

        /* Modal for incorrect answer explanation */
        #explanation-modal {
            position: fixed;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        #explanation-modal.visible {
            opacity: 1;
            visibility: visible;
        }
        .modal-content {
            background-color: #1e1a18;
            padding: 25px 30px;
            border-radius: 10px;
            max-width: 90%;
            width: 550px;
            border: 1px solid #EF6A00;
            color: #F5F5F5;
            text-align: left;
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }
        #explanation-modal.visible .modal-content { transform: scale(1); }
        .modal-content h3 {
            color: #EF6A00;
            margin-top: 0;
            margin-bottom: 15px;
            font-size: clamp(1.1em, 3.5vw, 1.3em);
        }
        .modal-content p {
            margin-bottom: 12px;
            line-height: 1.7;
            font-size: clamp(0.85em, 2.3vw, 0.95em);
        }
        #modal-correct-answer {
            font-weight: bold;
            color: #90EE90;
        }
        #close-modal-button {
            margin-top: 20px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>

<canvas id="chart-background-canvas"></canvas>

<div class="game-container">
    <div id="start-screen">
        <h1>Fundora</h1>
        <div class="story-text">
            プロトレーダーへの挑戦エントリーレベルへようこそ！<br><br>
            Fundoraは、あなたが長期的に市場で勝ち続けるための登竜門です。<br>
            この試練を通じて知識を武器に変え、リスク管理の技術を磨きましょう。<br>
            努力こそが、ここで評価される唯一の通貨です。
        </div>
        <button class="game-button" id="start-game-button">挑戦を開始する</button>
    </div>

    <div id="game-screen" style="display: none;">
        <div class="status-info">
            <span id="experience-points">得点: 0</span>
            <span id="completion-percentage">進行度: 0%</span>
            <span id="title">称号: 見習い</span>
        </div>
        <div class="progress-bar-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>
        <div class="question-area" id="question-area">
            <h2 id="question-number">問題 1/20</h2>
            <p class="question-text" id="question-text"></p>
            <ul class="options-list" id="options-list">
            </ul>
        </div>
        <div class="feedback-area" id="feedback-area">
            <h3 id="feedback-title"></h3>
            <p id="feedback-correct-answer"></p>
            <p id="feedback-explanation"></p>
            <p id="feedback-learning-points"></p>
            <button class="game-button" id="next-question-button">次へ進む</button>
        </div>
    </div>

    <div id="end-screen" style="display:none;">
        <h2 id="end-title"></h2>
        <p id="final-score"></p>
        <div id="weakness-feedback">
            <h3>あなたの課題（不正解だった問題）- クリックで解説表示</h3>
            <ul id="incorrect-questions-list">
            </ul>
        </div>
        <button class="game-button" id="restart-game-button">もう一度挑戦する</button>
    </div>
</div>

<div id="explanation-modal">
    <div class="modal-content">
        <h3 id="modal-question-text"></h3>
        <p id="modal-correct-answer"></p>
        <p id="modal-explanation"></p>
        <p id="modal-learning-points"></p>
        <button id="close-modal-button" class="game-button">閉じる</button>
    </div>
</div>


<script>
    // DOM要素の取得
    const startScreen = document.getElementById('start-screen');
    const gameScreen = document.getElementById('game-screen');
    const endScreenElement = document.getElementById('end-screen');
    const startGameButton = document.getElementById('start-game-button');
    const questionArea = document.getElementById('question-area');
    const questionNumberElement = document.getElementById('question-number');
    const questionTextElement = document.getElementById('question-text');
    const optionsListElement = document.getElementById('options-list');
    const feedbackArea = document.getElementById('feedback-area');
    const feedbackTitleElement = document.getElementById('feedback-title');
    const feedbackCorrectAnswerElement = document.getElementById('feedback-correct-answer');
    const feedbackExplanationElement = document.getElementById('feedback-explanation');
    const feedbackLearningPointsElement = document.getElementById('feedback-learning-points');
    const nextQuestionButton = document.getElementById('next-question-button');
    const experiencePointsElement = document.getElementById('experience-points');
    const completionPercentageElement = document.getElementById('completion-percentage');
    const titleElement = document.getElementById('title');
    const progressBarElement = document.getElementById('progress-bar');
    const endTitleElement = document.getElementById('end-title');
    const finalScoreElement = document.getElementById('final-score');
    const incorrectQuestionsListElement = document.getElementById('incorrect-questions-list');
    const restartGameButton = document.getElementById('restart-game-button');

    const explanationModal = document.getElementById('explanation-modal');
    const modalQuestionText = document.getElementById('modal-question-text');
    const modalCorrectAnswer = document.getElementById('modal-correct-answer');
    const modalExplanation = document.getElementById('modal-explanation');
    const modalLearningPoints = document.getElementById('modal-learning-points');
    const closeModalButton = document.getElementById('close-modal-button');

    // Chart Background Canvas
    const chartCanvas = document.getElementById('chart-background-canvas');
    const chartCtx = chartCanvas.getContext('2d');
    let chartData = [];
    const MAX_CHART_POINTS = 100; // Number of points on the chart
    let chartAnimationId;


    // ゲームの状態変数
    let currentQuestionIndex = 0;
    let score = 0;
    let correctAnswersCount = 0;
    let incorrectAnswers = [];
    let selectedOptionLi = null;

    const particleConfigs = [
        { color: '#EF6A00', speedFactor: 1, size: 4, density: 20 },
        { color: '#FFA500', speedFactor: 1.1, size: 4.5, density: 22 },
        { color: '#FFD700', speedFactor: 1.2, size: 5, density: 25 },
        { color: '#FF8C00', speedFactor: 1.3, size: 5.5, density: 28 },
        { color: '#FF4500', speedFactor: 1.4, size: 6, density: 30 }
    ];
    let currentParticleConfigIndex = 0;
    let activeParticles = [];
    const MAX_PARTICLES = 50;

    function updateParticleConfig() {
        const progressRatio = currentQuestionIndex / quizData.length;
        if (progressRatio >= 0.75) currentParticleConfigIndex = 3;
        else if (progressRatio >= 0.50) currentParticleConfigIndex = 2;
        else if (progressRatio >= 0.25) currentParticleConfigIndex = 1;
        else currentParticleConfigIndex = 0;
    }

    function createParticle() {
        if (activeParticles.length >= MAX_PARTICLES) {
            const oldParticle = activeParticles.shift();
            if (oldParticle && oldParticle.parentNode) {
                oldParticle.remove();
            }
        }
        const config = particleConfigs[currentParticleConfigIndex];
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + 'vw';
        particle.style.backgroundColor = config.color;
        particle.style.width = config.size + 'px';
        particle.style.height = config.size + 'px';
        const duration = (Math.random() * 3 + 3) / config.speedFactor;
        particle.style.animationDuration = duration + 's';
        particle.style.animationDelay = Math.random() * 2 + 's';
        document.body.appendChild(particle);
        activeParticles.push(particle);
        setTimeout(() => {
            if (particle.parentNode) particle.remove();
            activeParticles = activeParticles.filter(p => p !== particle);
        }, (duration + parseFloat(particle.style.animationDelay)) * 1000 + 500);
    }

    let particleInterval;
    function startParticles() {
        stopParticles();
        updateParticleConfig();
        const initialParticleCount = particleConfigs[currentParticleConfigIndex].density;
        for (let i = 0; i < initialParticleCount && i < MAX_PARTICLES; i++) createParticle();
        particleInterval = setInterval(() => {
            const config = particleConfigs[currentParticleConfigIndex];
            for(let i=0; i < Math.max(1, Math.floor(config.density / 10)) ; i++) createParticle();
        }, 700);
    }

    function stopParticles() {
        clearInterval(particleInterval);
        particleInterval = null;
        activeParticles.forEach(p => { if (p.parentNode) p.remove(); });
        activeParticles = [];
    }

    // Chart Animation Functions
    function resizeChartCanvas() {
        chartCanvas.width = window.innerWidth;
        chartCanvas.height = window.innerHeight;
        initializeChartData(); // Re-initialize data on resize
    }

    function initializeChartData() {
        chartData = [];
        let lastY = chartCanvas.height / 2;
        for (let i = 0; i < MAX_CHART_POINTS * 2; i++) { // Generate more points for smoother scrolling
            const change = (Math.random() - 0.5) * (chartCanvas.height * 0.15); // Max 15% height change
            lastY += change;
            lastY = Math.max(chartCanvas.height * 0.2, Math.min(chartCanvas.height * 0.8, lastY)); // Clamp Y
            chartData.push({ x: i * (chartCanvas.width / MAX_CHART_POINTS), y: lastY });
        }
    }
    let chartOffset = 0;
    function drawChart() {
        chartCtx.clearRect(0, 0, chartCanvas.width, chartCanvas.height);
        chartCtx.beginPath();
        chartCtx.moveTo(chartData[0].x - chartOffset, chartData[0].y);

        for (let i = 1; i < chartData.length; i++) {
            const xPos = chartData[i].x - chartOffset;
            if (xPos < - (chartCanvas.width / MAX_CHART_POINTS) * 5) continue; // Don't draw too far off-screen
            if (xPos > chartCanvas.width + (chartCanvas.width / MAX_CHART_POINTS) * 5) break; // Don't draw too far off-screen
            chartCtx.lineTo(xPos, chartData[i].y);
        }

        chartCtx.strokeStyle = '#EF6A00'; // Fundora Orange
        chartCtx.lineWidth = 2;
        chartCtx.stroke();

        // Add a secondary fainter line (e.g., moving average)
        chartCtx.beginPath();
        chartCtx.moveTo(chartData[0].x - chartOffset, chartData[0].y + 20); // Offset Y for second line
         for (let i = 1; i < chartData.length; i++) {
            const xPos = chartData[i].x - chartOffset;
            if (xPos < - (chartCanvas.width / MAX_CHART_POINTS) * 5) continue;
            if (xPos > chartCanvas.width + (chartCanvas.width / MAX_CHART_POINTS) * 5) break;
            chartCtx.lineTo(xPos, chartData[i].y + (Math.sin(i*0.1) * 15 + 20) ); // Simple variation for second line
        }
        chartCtx.strokeStyle = 'rgba(245, 245, 245, 0.5)'; // F5F5F5 with alpha
        chartCtx.lineWidth = 1;
        chartCtx.stroke();


        chartOffset += 0.5; // Speed of chart movement

        // If chart moved one segment, add new point and remove old one
        if (chartOffset >= (chartCanvas.width / MAX_CHART_POINTS)) {
            chartOffset = 0;
            chartData.shift(); // Remove oldest point
            let lastPoint = chartData[chartData.length -1];
            if (!lastPoint) { // Should not happen if initialized correctly
                initializeChartData(); // Failsafe
                lastPoint = chartData[chartData.length -1];
            }
            const change = (Math.random() - 0.5) * (chartCanvas.height * 0.15);
            let newY = lastPoint.y + change;
            newY = Math.max(chartCanvas.height * 0.2, Math.min(chartCanvas.height * 0.8, newY));
            chartData.push({ x: lastPoint.x + (chartCanvas.width / MAX_CHART_POINTS) , y: newY });
        }


        chartAnimationId = requestAnimationFrame(drawChart);
    }

    function startChartAnimation() {
        resizeChartCanvas(); // Set initial size and data
        if (chartAnimationId) cancelAnimationFrame(chartAnimationId); // Clear previous animation

    startGameButton.addEventListener('click', () => {
        startScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        endScreenElement.style.display = 'none';
        currentQuestionIndex = 0; score = 0; correctAnswersCount = 0; incorrectAnswers = [];
        updateStatus(); displayQuestion();
        startParticles();

    });

    function displayQuestion() {
        updateParticleConfig();
        questionArea.style.animation = 'none'; void questionArea.offsetWidth;
        questionArea.style.animation = 'slideIn 0.5s ease-out forwards';
        const currentQuiz = quizData[currentQuestionIndex];
        questionNumberElement.textContent = `問題 ${currentQuestionIndex + 1}/${quizData.length}`;
        questionTextElement.textContent = currentQuiz.question;
        optionsListElement.innerHTML = '';
        const animationSetIndex = Math.floor(currentQuestionIndex / 4) % optionAnimationStyles.length;
        const currentAnimationStyle = optionAnimationStyles[animationSetIndex];
        currentQuiz.options.forEach((option, index) => {
            const li = document.createElement('li');
            li.textContent = option; li.dataset.index = index;
            li.style.animation = 'none'; void li.offsetWidth;
            li.style.animation = `${currentAnimationStyle} 0.6s ease-out ${0.1 * (index + 1)}s forwards`;
            li.addEventListener('click', handleOptionClick);
            optionsListElement.appendChild(li);
        });
        questionArea.style.display = 'block';
        feedbackArea.style.display = 'none';
        nextQuestionButton.style.display = 'none';
    }

    function handleOptionClick(event) {
        if (selectedOptionLi) selectedOptionLi.classList.remove('selected');
        selectedOptionLi = event.target; selectedOptionLi.classList.add('selected');
        const options = optionsListElement.querySelectorAll('li');
        options.forEach(opt => opt.removeEventListener('click', handleOptionClick));
        options.forEach(opt => opt.style.cursor = 'default');
        checkAnswer(parseInt(selectedOptionLi.dataset.index));
    }

    function checkAnswer(selectedIndex) {
        const currentQuiz = quizData[currentQuestionIndex];
        const isCorrect = selectedIndex === currentQuiz.correctAnswer;
        feedbackArea.classList.remove('correct', 'incorrect');
        feedbackArea.style.animation = 'none'; void feedbackArea.offsetWidth;
        if (isCorrect) {
            score += 5; correctAnswersCount++;
            feedbackTitleElement.textContent = '正解！';
            feedbackArea.classList.add('correct');
            feedbackCorrectAnswerElement.textContent = '';
        } else {
            feedbackTitleElement.textContent = '不正解...';
            feedbackArea.classList.add('incorrect');
            feedbackCorrectAnswerElement.textContent = `正解は: ${currentQuiz.options[currentQuiz.correctAnswer]}`;
            incorrectAnswers.push(currentQuestionIndex);
        }
        feedbackExplanationElement.textContent = `解説: ${currentQuiz.explanation}`;
        feedbackLearningPointsElement.textContent = `学習ポイント: ${currentQuiz.learningPoints}`;
        feedbackArea.style.display = 'block';
        feedbackArea.style.animation = `${isCorrect ? 'correctShake' : 'incorrectShake'} 0.6s ease-in-out, feedbackSlide 0.5s ease-out forwards`;
        nextQuestionButton.style.display = 'inline-block';
        updateStatus();
    }

    nextQuestionButton.addEventListener('click', () => {
        currentQuestionIndex++;
        if (selectedOptionLi) { selectedOptionLi.classList.remove('selected'); selectedOptionLi = null; }
        if (currentQuestionIndex < quizData.length) displayQuestion();
        else showEndScreen();
    });

    function updateStatus() {
        experiencePointsElement.textContent = `得点: ${score}`;
        const percentage = Math.round(((currentQuestionIndex) / quizData.length) * 100);
        completionPercentageElement.textContent = `進行度: ${percentage}%`;
        progressBarElement.style.width = `${percentage}%`;
        if (score >= 80) titleElement.textContent = '称号: プロトレーダー';
        else if (score >= 60) titleElement.textContent = '称号: 上級トレーダー';
        else if (score >= 40) titleElement.textContent = '称号: 中級トレーダー';
        else if (score >= 20) titleElement.textContent = '称号: 初心者トレーダー';
        else titleElement.textContent = '称号: 見習い';
        updateParticleConfig();
    }

    function showEndScreen() {
        gameScreen.style.display = 'none';
        endScreenElement.style.display = 'block';
        stopParticles();
        stopChartAnimation(); // Stop chart animation

        let endMessage = "";
        if (correctAnswersCount === quizData.length) endMessage = "全問正解！素晴らしいです、プロトレーダー！";
        else if (correctAnswersCount >= quizData.length * 0.8) endMessage = "おめでとうございます！優秀な成績です！";
        else if (correctAnswersCount >= quizData.length * 0.6) endMessage = "よくできました！あと少しで高みへ！";
        else if (correctAnswersCount >= quizData.length * 0.4) endMessage = "まずまずの成績です。更なる学習で上を目指しましょう！";
        else endMessage = "お疲れ様でした。基礎からもう一度復習しましょう！";
        endTitleElement.textContent = endMessage;
        finalScoreElement.textContent = `最終得点: ${score}点 (${correctAnswersCount}/${quizData.length}問正解)`;
        incorrectQuestionsListElement.innerHTML = '';
        if (incorrectAnswers.length > 0) {
            incorrectAnswers.forEach((qIndex, displayIndex) => {
                const li = document.createElement('li');
                const questionData = quizData[qIndex];
                li.textContent = `問題 ${qIndex + 1}: ${questionData.question.substring(0, 50)}...`;
                li.dataset.qIndex = qIndex;
                li.style.animationDelay = `${0.1 * (displayIndex + 1)}s`;
                li.addEventListener('click', () => showExplanationModal(qIndex));
                incorrectQuestionsListElement.appendChild(li);
            });
        } else {
            const li = document.createElement('li');
            li.textContent = "不正解だった問題はありません。完璧です！";
            li.style.cursor = 'default';
            incorrectQuestionsListElement.appendChild(li);
        }
    }

    function showExplanationModal(qIndex) {
        const questionData = quizData[qIndex];
        modalQuestionText.textContent = `問題 ${qIndex + 1}: ${questionData.question}`;
        modalCorrectAnswer.textContent = `正解: ${questionData.options[questionData.correctAnswer]}`;
        modalExplanation.textContent = `解説: ${questionData.explanation}`;
        modalLearningPoints.textContent = `学習ポイント: ${questionData.learningPoints}`;
        explanationModal.classList.add('visible');
    }

    closeModalButton.addEventListener('click', () => explanationModal.classList.remove('visible'));

    // 初期表示
    startScreen.style.display = 'block';
    gameScreen.style.display = 'none';
    endScreenElement.style.display = 'none';
    // Initialize chart canvas on load but don't start animation until game starts
    window.addEventListener('load', resizeChartCanvas);

</script>
</body>
